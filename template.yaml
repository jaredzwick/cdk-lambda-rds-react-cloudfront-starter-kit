AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'
Resources:
  # Aurora RDS PostgreSQL Cluster
  AuroraCluster:
    Type: 'AWS::RDS::DBCluster'
    Properties:
      DatabaseName: 'myappdb'
      Engine: 'aurora-postgresql'
      MasterUsername: 'admin'  # Choose a secure master username
      MasterUserPassword: 
        Ref: AuroraMasterPassword  # Secret referenced for security
      DBClusterParameterGroupName: 'default.aurora-postgresql9.6'
      BackupRetentionPeriod: 7
      DeletionProtection: true
      VpcSecurityGroupIds:
        - !Ref LambdaSecurityGroup
      DBSubnetGroupName: !Ref DBSubnetGroup
      Tags:
        - Key: 'Environment'
          Value: 'Dev'

  # Aurora DB Instance
  AuroraInstance:
    Type: 'AWS::RDS::DBInstance'
    Properties:
      DBInstanceClass: 'db.t3.small'
      Engine: 'aurora-postgresql'
      DBClusterIdentifier: !Ref AuroraCluster
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref LambdaSecurityGroup

  # DB Subnet Group for Aurora (ensure you have appropriate subnets in your VPC)
  DBSubnetGroup:
    Type: 'AWS::RDS::DBSubnetGroup'
    Properties:
      DBSubnetGroupDescription: 'Subnets for Aurora PostgreSQL'
      SubnetIds:
        - 'subnet-xxxxxxxx'  # Replace with your subnet IDs
        - 'subnet-yyyyyyyy'

  # Secrets Manager for Aurora DB password (ensure you store the password securely)
  AuroraMasterPassword:
    Type: 'AWS::SecretsManager::Secret'
    Properties:
      Name: 'AuroraMasterPassword'
      Description: 'Password for the Aurora PostgreSQL master user'
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: 'password'
        PasswordLength: 16
        ExcludeCharacters: '"@/'

  # Lambda Security Group (for DB access)
  LambdaSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: 'Allow Lambda functions to access the Aurora DB'
      VpcId: 'vpc-xxxxxxxx'  # Replace with your VPC ID
      SecurityGroupIngress:
        - IpProtocol: 'tcp'
          FromPort: '5432'  # Default PostgreSQL port
          ToPort: '5432'
          CidrIp: '0.0.0.0/0'

  # Lambda function
  MyLambdaFunction:
    Type: 'AWS::Serverless::Function'
    Properties:
      Handler: 'dist/index.handler'
      Runtime: 'nodejs18.x'
      MemorySize: 128
      Timeout: 10
      CodeUri: './src'  # Path to the TypeScript code (compiled code should go here)
      Environment:
        Variables:
          DB_HOST: !GetAtt AuroraCluster.Endpoint.Address
          DB_NAME: 'myappdb'
          DB_USER: 'admin'  # Ensure you use the correct username
          DB_PASSWORD: !Ref AuroraMasterPassword  # Use Secrets Manager to reference password securely
      VpcConfig:
        SubnetIds:
          - 'subnet-xxxxxxxx'  # Replace with your subnet IDs
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
      Events:
        ApiEvent:
          Type: 'Api'
          Properties:
            RestApiId: !Ref MyApi
            Path: '/items'
            Method: 'GET'

  # API Gateway for Lambda
  MyApi:
    Type: 'AWS::Serverless::Api'
    Properties:
      Name: 'MyApi'
      StageName: 'dev'
      Auth:
        DefaultAuthorizer: 'CognitoUserPool'
        Authorizers:
          CognitoUserPool:
            UserPoolArn: !GetAtt UserPool.Arn
            Identity:
              ReauthorizeEvery: 0  # Avoids the need for users to authenticate every time

  # Cognito User Pool
  UserPool:
    Type: 'AWS::Cognito::UserPool'
    Properties:
      UserPoolName: 'MyAppUserPool'
      AliasAttributes:
        - 'email'
      AutoVerifiedAttributes:
        - 'email'
      MfaConfiguration: 'OFF'
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpLambda.Arn

  # Cognito User Pool Client
  UserPoolClient:
    Type: 'AWS::Cognito::UserPoolClient'
    Properties:
      ClientName: 'MyAppClient'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - 'ALLOW_USER_PASSWORD_AUTH'
        - 'ALLOW_USER_SRP_AUTH'
        - 'ALLOW_REFRESH_TOKEN_AUTH'

  # PreSignUp Lambda (Trigger for Cognito user sign-up)
  PreSignUpLambda:
    Type: 'AWS::Lambda::Function'
    Properties:
      Handler: 'preSignUp.handler'
      Runtime: 'nodejs18.x'
      CodeUri: './src'  # Path to the TypeScript code
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref UserPool

Outputs:
  ApiUrl:
    Description: 'API Gateway endpoint URL'
    Value: !Sub 'https://${MyApi}.execute-api.${AWS::Region}.amazonaws.com/dev/items'
  UserPoolId:
    Description: 'Cognito User Pool ID'
    Value: !Ref UserPool
  AuroraClusterEndpoint:
    Description: 'Aurora PostgreSQL Cluster Endpoint'
    Value: !GetAtt AuroraCluster.Endpoint.Address
